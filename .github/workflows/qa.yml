name: Portal QA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, fileinfo, openssl, zlib
          tools: composer:v2
      - name: Composer dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Laravel tests (routes, errors, headers)
        run: php artisan test
      - name: Browser dependency hashes and published npm advisories
        run: python3 tests/Integration/vendor-audit.py --advisories
      - name: Installation, integrity, permissions, backups, SMTP and bulk data
        env:
          PORTAL_TEST_PHP_VERSION: ${{ matrix.php }}
        run: bash tests/Integration/run.sh
